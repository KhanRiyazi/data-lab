name: CI and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install app requirements
        run: pip install -r requirements.txt

      - name: Compile all Python files
        run: python -m compileall -q app

      - name: Smoke test the app
        env:
          DATABASE_URL: sqlite:///./ci.db
        run: |
          pip install httpx
          python - <<'EOF'
          from fastapi.testclient import TestClient
          from app.main import app
          c = TestClient(app)
          assert c.get("/api/health").json() == {"status": "ok"}
          assert c.get("/").status_code == 200
          assert c.get("/api/applications").status_code == 403
          print("smoke ok")
          EOF

  deploy:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger Render deploy
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::error::RENDER_DEPLOY_HOOK secret is missing. Add it under Settings > Secrets and variables > Actions > Secrets."
            exit 1
          fi
          curl -fsS --retry 3 --max-time 30 -X POST "$HOOK" > /dev/null
          echo "Render deploy triggered"